services:
  - type: web
    name: sms-spam-detection
    env: python
    plan: free

    pythonVersion: 3.11.9

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn myproject.wsgi:application

    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
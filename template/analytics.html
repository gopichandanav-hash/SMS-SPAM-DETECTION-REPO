<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .analytics-card {
            width: 100%;
            max-width: 900px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
        }

        .back-link:hover {
            background: #4338ca;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }

        p {
            margin: 0 0 20px;
            color: #64748b;
        }

        .chart {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            align-items: end;
            height: 240px;
            margin-top: 16px;
        }

        .bar {
            background: linear-gradient(180deg, #6366f1 0%, #46e5b0 100%);
            border-radius: 10px 10px 4px 4px;
            min-height: 20px;
            position: relative;
        }

        .bar span {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #64748b;
        }

        .bar-value {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            color: #4338ca;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 16px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="analytics-card">
        <h2>Spam Messages by Day</h2>
        <p>This chart shows the spam traffic recorded from the saved reports.</p>

        <div class="chart">
            {% for label, count in chart_data %}
                <div class="bar" style="height: {% if report_count > 0 %}{{ count|floatformat:0 }}{% else %}0{% endif %}0%">
                    <span class="bar-value">{{ count }}</span>
                    <span>{{ label }}</span>
                </div>
            {% endfor %}
        </div>

        <a href="/homepage/" class="back-link">Back to Home</a>
    </div>
</body>
</html>

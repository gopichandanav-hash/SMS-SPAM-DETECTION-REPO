<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Spam Detection</title>
    <style>
        :root {
            --bg: #f5f7ff;
            --panel: #ffffff;
            --panel-strong: #eef2ff;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #4f46e5;
            --accent-soft: #c7d2fe;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
            color: var(--text);
        }

        .layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: #3730a3;
            color: white;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            justify-content: space-between;
        }

        .sidebar h2 {
            margin: 0;
            font-size: 1.35rem;
            letter-spacing: 0.04em;
        }

        .sidebar p {
            margin: 10px 0 0;
            color: rgba(255,255,255,0.82);
            line-height: 1.7;
            max-width: 220px;
        }

        .sidebar .sidebar-actions {
            margin-top: 32px;
        }

        .sidebar .cases-button {
            display: block;
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: none;
            background: rgba(255,255,255,0.12);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
            text-align: center;
        }

        .sidebar .cases-button:hover {
            background: rgba(255,255,255,0.2);
        }

        .case-link {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .main {
            padding: 32px;
        }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
        }

        .header-actions a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            border: 1px solid transparent;
            padding: 8px 14px;
            border-radius: 14px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .header-actions a:hover {
            background: rgba(79, 70, 229, 0.08);
            border-color: rgba(79, 70, 229, 0.16);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 32px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
        }

        .navbar .brand {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: var(--text);
        }

        .navbar .nav-links {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .navbar .nav-link {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 999px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            background: rgba(79, 70, 229, 0.1);
            color: var(--accent);
        }

        .navbar .nav-button {
            border: 1px solid rgba(79, 70, 229, 0.18);
            background: white;
            color: var(--accent);
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .navbar .nav-button:hover {
            background: #eef2ff;
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.1);
        }

        .hidden {
            display: none;
        }

        .header {
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 3rem);
            line-height: 1.05;
        }

        .header p {
            margin: 10px 0 0;
            max-width: 620px;
            color: var(--muted);
            line-height: 1.7;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--panel-strong);
            color: var(--text);
            font-weight: 600;
            border: 1px solid rgba(79,70,229,0.12);
        }

        .cases {
            margin-top: 32px;
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .case-card {
            padding: 26px 24px;
            border-radius: 24px;
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .case-card:hover {
            transform: translateY(-4px);
            border-color: rgba(79,70,229,0.18);
        }

        .case-card h3 {
            margin: 0 0 10px;
            font-size: 1.15rem;
        }

        .case-card p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.75;
        }

        .case-card span {
            display: inline-flex;
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .actions {
            margin-top: 32px;
        }

        .show-cases-button {
            border: none;
            border-radius: 16px;
            padding: 14px 22px;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .show-cases-button:hover {
            transform: translateY(-1px);
            background: #4338ca;
        }

        .table-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .table-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.25);
        }

        .table-button .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.16);
            font-size: 1.1rem;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 880px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
            }

            .sidebar h2 {
                font-size: 1rem;
            }

            .main {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="brand">SMS Spam Detection</div>
        <div class="nav-links">
            <a href="/analytics/" class="nav-link">Analytics</a>
            <a href="#" class="nav-link">Settings</a>
            <a href="/" class="nav-button">Logout</a>
        </div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                
            </div>
            <div class="sidebar-actions">
                <a href="/profile/" class="cases-button">View Profile</a>
            </div>
        </aside>

        <main class="main">
            <section class="header">
                <div>
                    <h1>Spam Message Overview</h1>
                    <p>Review flagged SMS messages, monitor suspicious activity, and stay updated with the latest spam detections.</p>
                    <a href="/viewcases/" id="showCasesBtn" class="table-button">
                        <span class="icon">🗂️</span>
                        <span>View Spam Messages</span>
                    </a>
                </div>
                
            </section>

            
        </main>
    </div>

</body>
</html>
